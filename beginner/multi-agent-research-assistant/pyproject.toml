[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-research-assistant"
version = "1.0.0"
description = "A sequential multi-agent research assistant built with LangGraph."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.60,<2.0",
  "langchain-core>=0.3.25,<2.0",
  "langchain-openai>=0.2.10,<2.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "python-dotenv>=1.0,<2.0",
  "tavily-python>=0.5,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
