<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Bug Triage</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 20px}textarea{width:100%;height:160px}button{background:#111;color:#fff;padding:10px 18px;border:0;border-radius:8px;cursor:pointer}pre{background:#f6f6f6;padding:16px;border-radius:10px;white-space:pre-wrap}.badge{display:inline-block;padding:4px 10px;border-radius:20px;background:#eef}</style></head><body><h1>🐛 AI Bug Triage & Debugging Assistant</h1><p>Paste an error → Classifier → Conditional Router → Solution → Reviewer</p><textarea id="e" placeholder="Paste traceback here...">TypeError: Cannot read properties of undefined (reading 'map')
    at App (App.js:12:15)</textarea><br><br><button onclick="go()">Triage Error</button> <span id="route" class="badge"></span><div id="out"></div><script>async function go(){const error=document.getElementById('e').value;const r=await fetch('/api/triage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({error})});const d=await r.json();document.getElementById('route').textContent=d.route+' • '+d.classification.category+' ('+d.classification.confidence+')';document.getElementById('out').innerHTML=`<h2>${d.fix.title}</h2><p><b>Root cause:</b> ${d.fix.root_cause}</p><pre>${d.fix.diff}</pre><p>${d.fix.explanation}</p><h3>Verify</h3><ul>${d.fix.verification.map(v=>'<li>'+v+'</li>').join('')}</ul><h3>Reviewer: ${d.review.verdict}</h3><p>${d.review.feedback}</p>`}</script></body></html>
